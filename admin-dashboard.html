<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="dashboard-page">
  <main class="dashboard-shell">
    <header class="dashboard-header">
      <div>
        <p class="admin-label">Admin Mode</p>
        <h1>Dashboard</h1>
      </div>
      <button id="logout-button" class="logout-button" type="button">Log Out</button>
    </header>

    <section class="dashboard-grid" aria-label="Admin dashboard widgets">
      <article class="dashboard-card">
        <h2>Site Overview</h2>
        <p>Placeholder analytics and website health metrics will appear here.</p>
      </article>
      <article class="dashboard-card">
        <h2>Recent Messages</h2>
        <p>Incoming contact form submissions and inquiries can be managed in this panel.</p>
      </article>
      <article class="dashboard-card">
        <h2>Content Queue</h2>
        <p>Draft updates, media uploads, and scheduled changes can be tracked here.</p>
      </article>
    </section>
  </main>

  <script src="scripts/dashboard-guard.js"></script>
</body>
</html>
