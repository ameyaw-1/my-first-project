<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-page">
  <main class="admin-wrapper">
    <section class="admin-card">
      <p class="admin-label">Restricted Area</p>
      <h1>Admin Login</h1>
      <p class="admin-help">Enter your credentials to access the dashboard.</p>

      <form id="admin-login-form" class="admin-form" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button type="submit">Sign In</button>
      </form>

      <p id="login-message" class="admin-message" role="alert" aria-live="polite"></p>
      <p class="admin-note">Demo credentials: <code>admin</code> / <code>rizyll123</code></p>
    </section>
  </main>

  <script src="scripts/admin-auth.js"></script>
</body>
</html>
